<!DOCTYPE html>
<html>

<head>
    <title>FitBuddy</title>
</head>

<body>

    <h1>FitBuddy</h1>
    <h2>AI Fitness Plan Generator</h2>

    <p>Create your personalized fitness plan with AI.</p>

    <form method="post" action="/generate-workout">

        <label>Name:</label>
        <input type="text" name="name" required>

        <br><br>

        <label>Age:</label>
        <input type="number" name="age" required>

        <br><br>

        <label>Weight (kg):</label>
        <input type="number" step="0.1" name="weight" required>

        <br><br>

        <label>Fitness Goal:</label>
        <select name="goal" required>
            <option value="Weight Loss">Weight Loss</option>
            <option value="Muscle Gain">Muscle Gain</option>
            <option value="General Fitness">General Fitness</option>
        </select>

        <br><br>

        <label>Workout Intensity:</label>
        <select name="intensity" required>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select>

        <br><br>

        <button type="submit">Generate Workout Plan</button>

    </form>

</body>
</html>
